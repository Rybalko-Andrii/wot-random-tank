<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoT Random Tank</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  padding: 20px;
}
.app {
  width: min(720px, 100%);
  margin: 0 auto;
  padding: 22px;
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 20px;
}
#tankName {
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: clamp(32px, 8vw, 70px);
  font-weight: 800;
  padding: 20px;
  background: #252525;
  border: 1px solid #3a3a3a;
  border-radius: 16px;
  margin-bottom: 16px;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: #353535;
}
button:active { transform: scale(.98); }
#pick {
  width: 100%;
  font-size: 20px;
  background: #b53a20;
}
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}
#addPanel, #listPanel {
  display: none;
  margin-top: 14px;
}
#addPanel.show, #listPanel.show { display: block; }
#newTankName {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #252525;
  color: #fff;
  font-size: 16px;
  margin-bottom: 10px;
}
#saveTank { width: 100%; background: #355c2a; }
#tankList {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tank-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  background: #252525;
  border: 1px solid #353535;
  border-radius: 10px;
}
.tank-item span {
  overflow-wrap: anywhere;
  font-size: 17px;
}
.delete {
  flex-shrink: 0;
  background: #7a2f2f;
  padding: 9px 12px;
}
.empty {
  text-align: center;
  color: #999;
  padding: 20px;
}
@media (max-width: 480px) {
  body { padding: 10px; }
  .app { padding: 14px; }
  .row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <div id="tankName">Натисни кнопку</div>

  <button id="pick">🎲 Випадковий танк</button>

  <div class="row">
    <button id="toggleAdd">➕ Додати танк</button>
    <button id="toggleList">📋 Мій список</button>
  </div>

  <div id="addPanel">
    <input id="newTankName" type="text" placeholder="Назва танка">
    <button id="saveTank">Додати</button>
  </div>

  <div id="listPanel">
    <div id="tankList"></div>
  </div>
</div>

<script>
const defaultTanks = [
  "Rhm. Pzw.",
  "E 50 M",
  "Leopard 1",
  "E 100",
  "Maus",
  "Pz.Kpfw. VII",
  "Grille 15",
  "Jg.Pz. E 100",
  "G.W. E 100",
  "T-100 LT",
  "K-91",
  "Об. 140",
  "Об. 430У",
  "ІС-4",
  "ІС-7",
  "Об. 277",
  "Об. 705А",
  "СТ-II",
  "Об. 260",
  "T110E5",
  "T57 Heavy",
  "Stinger",
  "T110E3",
  "T110E4",
  "T92 HMC",
  "AMX 13 105",
  "EBR 105",
  "AMX 30 B",
  "B-C 25 t",
  "AMX 50 B",
  "AMX M4 54",
  "Foch B",
  "Foch 155",
  "B-C 155 58",
  "Centurion AX",
  "Canopener",
  "S. Conqueror",
  "Fv4005",
  "FV215b 183",
  "Conqueror GC",
  "121",
  "121B",
  "113",
  "WZ-111 5A",
  "STB-1",
  "Type 5 Heavy",
  "TVP T 50/51",
  "Vz. 55",
  "Kranvagn",
  "Udes 15/16",
  "Progetto 65",
  "Carro 45 t",
  "Rinoceronte",
  "Minotauro"
];

const STORAGE_KEY = "wot-random-tanks-v2";

function loadTanks() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved) && saved.length) return saved;
  } catch (error) {}
  return [...defaultTanks];
}

let tanks = loadTanks();

const tankName = document.getElementById("tankName");
const addPanel = document.getElementById("addPanel");
const listPanel = document.getElementById("listPanel");
const newTankName = document.getElementById("newTankName");
const tankList = document.getElementById("tankList");

function saveTanks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tanks));
}

function renderList() {
  tankList.innerHTML = "";

  if (tanks.length === 0) {
    tankList.innerHTML = '<div class="empty">Список порожній</div>';
    return;
  }

  tanks.forEach((tank, index) => {
    const item = document.createElement("div");
    item.className = "tank-item";

    const name = document.createElement("span");
    name.textContent = tank;

    const removeButton = document.createElement("button");
    removeButton.className = "delete";
    removeButton.textContent = "Видалити";
    removeButton.addEventListener("click", () => {
      tanks.splice(index, 1);
      saveTanks();
      renderList();
    });

    item.append(name, removeButton);
    tankList.appendChild(item);
  });
}

document.getElementById("pick").addEventListener("click", () => {
  if (tanks.length === 0) {
    tankName.textContent = "Список порожній";
    return;
  }

  const randomIndex = Math.floor(Math.random() * tanks.length);
  tankName.textContent = tanks[randomIndex];
});

document.getElementById("toggleAdd").addEventListener("click", () => {
  addPanel.classList.toggle("show");
  if (addPanel.classList.contains("show")) newTankName.focus();
});

document.getElementById("toggleList").addEventListener("click", () => {
  listPanel.classList.toggle("show");
  if (listPanel.classList.contains("show")) renderList();
});

function addTank() {
  const name = newTankName.value.trim();
  if (!name) {
    newTankName.focus();
    return;
  }

  tanks.push(name);
  saveTanks();
  newTankName.value = "";
  addPanel.classList.remove("show");
  renderList();
}

document.getElementById("saveTank").addEventListener("click", addTank);

newTankName.addEventListener("keydown", (event) => {
  if (event.key === "Enter") addTank();
});
